<html lang="zh-CN">

    <script src="../js/login.js"></script>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    
<!-- 导航栏 -->
<nav class="navbar navbar-expand-md navbar-light bg-light">
  <div class="container">
    <!-- 品牌Logo -->
    <a class="navbar-brand d-flex align-items-center " href="index.html">
      <img src="../image/logo.png" class="" alt="博客Logo" style="max-height: 40px; margin-right: 20px;">
    </a>
    
    <!-- 汉堡菜单按钮 -->
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <!-- 导航内容 -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mr-auto ">
        <li class="nav-item ">
          <a class="nav-link  h5" href="index.html">主页</a>
        </li>
        <li class="nav-item">
          <a class="nav-link h5" href="recommend.html">推荐</a>
        </li>
 
        <li class="nav-item">
          <a class="nav-link h5" href="mine.html">关于我</a>
        </li>
      </ul>
      
  
      
      <!-- 登录注册按钮和主题切换 -->
      <div class="ml-3 d-none d-md-flex align-items-center">
        <a href="login.html" class="btn btn-outline-primary mr-2">登录</a>
        <a href="register.html" class="btn btn-primary mr-3">注册</a>
      
      </div>
    </div>
  </div>
</nav>

<div class="container">
        <div class="login-box">
            <h3 class="text-center mb-4">登录</h3>
            
            <form id="loginForm">
                <!-- 用户名 -->
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" class="form-control" id="username" placeholder="请输入用户名" >
                </div>
                
                <!-- 密码 -->
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" class="form-control" id="password" placeholder="请输入密码" >
                </div>
                
                <!-- 登录按钮 -->
                <button type="button" class="btn btn-primary btn-block" onclick="login()">登录</button>
                
                <!-- 辅助链接 -->
                <div class="text-center mt-3">
                    <span>没有账号?</span>
                    <span class="mx-2">|</span>
                    <a href="register.html" class="text-muted">去注册</a>
                </div>
            </form>
        </div>
    </div>
  
<!-- 页脚 -->
<footer class="footer">

        <p>© 2025 我的博客网站 | 专注分享技术与生活</p>
